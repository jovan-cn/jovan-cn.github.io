name: crowdin

on:
  push:
    branches: [ master ]
    #paths:
    #  - 'data/zh/**'  # trigger by zh data pushing

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  sync-translations:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate config
        run: |
          pwd
          ls -la
          cat .github/config/crowdin.yaml
          ls -la data/zh/

      - name: crowdin action
        uses: crowdin/github-action@master
        with:
          #command: upload sources # always complain configuration file doesn't exist
          config: ${{ github.workspace }}/.github/config/crowdin.yaml
          upload_sources: true
          upload_translations: false
          download_translations: true
          auto_approve_imported: true
          localization_branch_name: crowdin_translations
          create_pull_request: true
          pull_request_title: 'Auto Crowdin Translations'
          pull_request_body: 'Auto Crowdin translations by [Crowdin GH Action](https://github.com/crowdin/github-action)'
          pull_request_base_branch_name: 'master'
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
          CROWDIN_PROJECT_ID: ${{ secrets.CROWDIN_PROJECT_ID }}
          CROWDIN_API_TOKEN: ${{ secrets.CROWDIN_API_TOKEN }}
