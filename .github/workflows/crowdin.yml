name: crowdin

on:
  push:
    branches: [ master ]
    paths:
      - 'data/zh/**'  # trigger by zh data pushing

jobs:
  sync-translations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate config
        run: |
          pwd
          ls -la .github/config/
          cat .github/config/crowdin.yaml

      # step 1. upload string to Crowdin
      - name: Upload sources
        uses: crowdin/github-action@master
        with:
          command: upload sources
          config: .github/config/crowdin.yaml
        env:
          CROWDIN_PROJECT_ID: ${{ secrets.CROWDIN_PROJECT_ID }}
          CROWDIN_API_TOKEN: ${{ secrets.CROWDIN_API_TOKEN }}

      # step 2：trigger auto translate（optional）
      - name: Pre-translate
        if: github.event_name == 'push'
        run: |
          curl -X POST \
            -H "Content-type: application/json" \
            -H "Authorization: Bearer ${{ secrets.CROWDIN_API_TOKEN }}" \
            "https://api.crowdin.com/api/v2/projects/${{ secrets.CROWDIN_PROJECT_ID }}/pre-translations" \
            -d '{"languageIds": ["en"], "method": "mt"}'  # specific target language and machine translation

      # step 3：waiting for human audit（do it in Crowdin）

      # step 4: checking periodly and download translations
      - name: Download approved translations
        uses: crowdin/github-action@master
        with:
          command: download
        env:
          CROWDIN_API_TOKEN: ${{ secrets.CROWDIN_API_TOKEN }}

      # step 5(optional): auto commit to github
      - name: Commit translations
        run: |
          git config --global user.name "i18n Bot"
          git config --global user.email "i18n-bot@example.com"
          git add data/
          git diff --quiet || (git commit -m "[i18n] Update translations from Crowdin" && git push)